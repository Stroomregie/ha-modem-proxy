name: "Modem Proxy"
version: "2.0.0"
slug: "modem_proxy"
description: "Reverse proxy naar meerdere interne apparaten (modem, Marstek, Smart EVSE, ...), elk met een eigen poort en Host-header"
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
options:
  targets:
    - name: "Modem"
      target_ip: "192.168.2.254"
      target_host: "192.168.2.254"
      listen_port: 8081
schema:
  targets:
    - name: "str?"
      target_ip: str
      target_host: str
      listen_port: int
